{% extends "base.html" %}
{% block title %}Contact — Mehboob Meghani{% endblock %}
{% block content %}
<section class="page">
  <div class="container">
    <h1>Contact</h1>
    <p class="lead">Tell me what you're looking for. This goes straight to my inbox — no middlemen.</p>

    {% if sent %}
    <div class="alert alert-success">Thanks — message received. I'll get back to you.</div>
    {% endif %}

    <form method="post" action="{{ url_for('public.contact_submit') }}" class="contact-form">
      <label>Name
        <input type="text" name="name" required>
      </label>
      <label>Email
        <input type="email" name="email" required>
      </label>
      <label>What brings you here?
        <select name="interest">
          <option value="hiring">I'm hiring</option>
          <option value="project">Trading project</option>
          <option value="collaboration">Collaboration</option>
          <option value="exploring">Just exploring</option>
        </select>
      </label>
      <label>Message
        <textarea name="message" rows="5"></textarea>
      </label>
      <button class="btn btn-primary" type="submit">Send</button>
    </form>
  </div>
</section>
{% endblock %}
