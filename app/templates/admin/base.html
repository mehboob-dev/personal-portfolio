<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Dashboard{% endblock %} — Dynamic QR & Lead Admin</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}">
  <link rel="stylesheet" href="https://unpkg.com/tabulator-tables@6.2.1/dist/css/tabulator.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <script src="https://unpkg.com/tabulator-tables@6.2.1/dist/js/tabulator.min.js"></script>
  <script src="{{ url_for('static', filename='js/table.js') }}"></script>
</head>
<body>
  <header class="admin-header">
    <div class="container-fluid">
      <a class="brand" href="{{ url_for('admin.dashboard') }}">
        <img class="brand-logo" src="{{ url_for('static', filename='img/WhiteGoldTransparent.png') }}" alt="QR & Lead Manager">
      </a>

      <button id="admin-mobile-toggle" class="mobile-nav-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false">
        ☰
      </button>

      <div class="header-controls">
        <nav id="admin-site-nav" class="site-nav">
          <a href="{{ url_for('admin.dashboard') }}">Dashboard</a>
          <a href="{{ url_for('admin.campaigns') }}">Campaigns</a>
          <a href="{{ url_for('admin.qr_list') }}">QR Codes</a>
          <a href="{{ url_for('admin.leads') }}">Leads</a>
          <a href="{{ url_for('public.home') }}" target="_blank" rel="noopener">View Site ↗</a>
          <a href="{{ url_for('admin.logout') }}" style="color: var(--danger);">Logout</a>
        </nav>
      </div>
    </div>
  </header>

  <main class="admin-main">
    <div class="container-fluid">
      {% block content %}{% endblock %}
    </div>
  </main>

  <script>
    (function () {
      var btn = document.getElementById('admin-mobile-toggle');
      var nav = document.getElementById('admin-site-nav');
      if (btn && nav) {
        btn.addEventListener('click', function () {
          var open = nav.classList.toggle('open');
          btn.setAttribute('aria-expanded', open ? 'true' : 'false');
          btn.textContent = open ? '✕' : '☰';
        });
        nav.querySelectorAll('a').forEach(function (link) {
          link.addEventListener('click', function () {
            nav.classList.remove('open');
            btn.setAttribute('aria-expanded', 'false');
            btn.textContent = '☰';
          });
        });
      }
    })();
  </script>
</body>
</html>
