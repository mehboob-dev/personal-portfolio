<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Admin{% endblock %} — QR Manager</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
  <header class="admin-header">
    <div class="container">
      <a class="brand" href="{{ url_for('admin.dashboard') }}">QR Manager</a>
      <nav class="site-nav">
        <a href="{{ url_for('admin.dashboard') }}">Dashboard</a>
        <a href="{{ url_for('admin.campaigns') }}">Campaigns</a>
        <a href="{{ url_for('admin.qr_list') }}">QR Codes</a>
        <a href="{{ url_for('admin.leads') }}">Leads</a>
        <a href="{{ url_for('admin.logout') }}">Logout</a>
      </nav>
    </div>
  </header>

  <main class="admin-main">
    <div class="container">
      {% block content %}{% endblock %}
    </div>
  </main>
</body>
</html>
