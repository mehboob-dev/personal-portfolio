{% extends "admin/base.html" %}
{% block title %}Leads — Dynamic QR & Lead Admin{% endblock %}

{% block content %}
<div class="card" style="padding: 0; overflow: hidden; margin-bottom: 24px;">
  <div style="padding: 14px 18px; border-bottom: 1px solid var(--border-subtle); background: var(--bg-subtle); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;">
    <span class="mono" style="font-weight: 700; font-size: 0.85rem; color: var(--accent-primary);">
      {{ show|upper }} LEADS ({{ leads|length }})
    </span>
    <div style="display: flex; gap: 8px; align-items: center;">
      <button id="reset-tabulator-filters" class="btn btn-sm btn-mono" type="button">Reset Filters ✕</button>
      <a class="btn btn-primary btn-mono" href="{{ url_for('admin.leads_csv', show=show) }}">Export CSV ({{ show|capitalize }}) ↓</a>
    </div>
  </div>
</div>

<!-- Bulk actions toolbar -->
<div id="bulk-toolbar" style="display: none; background: var(--bg-subtle); border: 1px solid var(--accent-primary); border-radius: var(--radius-sm); padding: 10px 16px; margin-bottom: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;">
  <span class="badge badge-accent" id="bulk-selected-count">0 selected</span>
  <form id="bulk-form" method="post" action="{{ url_for('admin.leads_bulk', show=show) }}" style="display: flex; gap: 8px; align-items: center; margin: 0;">
    <input type="hidden" name="action" id="bulk-action-input" value="trash">
    <div id="bulk-hidden-ids"></div>
    <button type="button" class="btn btn-sm btn-danger" onclick="submitBulk('trash', 'Move selected inquiries to trash?')">Trash Selected</button>
    <button type="button" class="btn btn-sm btn-mono" onclick="deselectAllRows()">Cancel</button>
  </form>
</div>

<!-- TABULATOR LEADS TABLE -->
<div id="leads-tabulator-table"></div>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    var CSRF_TOKEN = {{ csrf_token() | tojson }};
    var tableData = [
      {% for lead in leads %}
      {
        id: {{ lead.id }},
        name: "{{ lead.name|replace('"', '\\"') }}",
        email: "{{ lead.email|replace('"', '\\"') }}",
        interest: "{{ (lead.interest or '')|replace('"', '\\"') }}",
        message: "{{ (lead.message or '')|replace('\r', ' ')|replace('\n', ' ')|replace('"', '\\"') }}",
        date_utc: "{{ lead.created_at.strftime('%Y-%m-%d') if lead.created_at else '' }}",
        time_utc: "{{ lead.created_at.strftime('%H:%M:%S') if lead.created_at else '' }}",
        is_deleted: {{ 'true' if lead.is_deleted else 'false' }},
        detail_url: "{{ url_for('admin.lead_detail', lid=lead.id) }}",
        restore_url: "{{ url_for('admin.lead_restore', lid=lead.id) }}",
        delete_url: "{{ url_for('admin.lead_delete', lid=lead.id) }}",
        purge_url: "{{ url_for('admin.lead_purge', lid=lead.id) }}"
      }{% if not loop.last %},{% endif %}
      {% endfor %}
    ];

    var uniqueInterests = [...new Set(tableData.map(function(r) { return r.interest; }))].filter(Boolean).sort();

    var table = TableKit.create("#leads-tabulator-table", {
      data: tableData,
      placeholder: "No {{ show }} inquiries found.",
      paginationSizeSelector: [10, 20, 50, 100, true],
      resetButton: "#reset-tabulator-filters",
      rowClick: function (e, row) {
        if (e.target.closest('a, button, form, input, select, .tabulator-cell:first-child')) {
          return;
        }
        var data = row.getData();
        if (data.detail_url) {
          window.location.href = data.detail_url;
        }
      },
      columns: [
        {
          title: "Date (UTC)",
          field: "date_utc",
          headerFilter: TableKit.customDateFilterEditor,
          headerFilterFunc: TableKit.advancedDateFilterFunc,
          width: 180,
          formatter: function (cell) {
            return '<span class="mono" style="font-size:0.8rem; font-weight:600;">' + (cell.getValue() || '—') + '</span>';
          }
        },
        {
          title: "Time (UTC)",
          field: "time_utc",
          headerFilter: "input",
          width: 95,
          formatter: function (cell) {
            return '<span class="mono muted" style="font-size:0.78rem;">' + (cell.getValue() || '—') + '</span>';
          }
        },
        {
          title: "Name",
          field: "name",
          headerFilter: "input",
          formatter: function (cell) {
            var row = cell.getRow().getData();
            return '<a href="' + row.detail_url + '" style="font-weight:700; color:var(--text-primary);">' + cell.getValue() + '</a>';
          }
        },
        {
          title: "Email Address",
          field: "email",
          headerFilter: "input",
          formatter: function (cell) {
            return '<a href="mailto:' + cell.getValue() + '" class="mono" style="font-size:0.82rem;">' + cell.getValue() + '</a>';
          }
        },
        {
          title: "Inquiry Focus",
          field: "interest",
          headerFilter: TableKit.customDropdownFilter(uniqueInterests),
          headerFilterFunc: TableKit.exactMatchFilter,
          formatter: function (cell) {
            var val = cell.getValue();
            return val ? '<span class="badge badge-accent">' + val + '</span>' : '<span class="muted">—</span>';
          }
        },
        {
          title: "Message Preview (Click for Full)",
          field: "message",
          headerFilter: "input",
          formatter: function (cell) {
            var row = cell.getRow().getData();
            var val = cell.getValue() || '—';
            return '<a href="' + row.detail_url + '" style="color:var(--text-secondary); text-decoration:none; display:block; max-width:320px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:0.85rem;">' + val + '</a>';
          }
        },
        {
          title: "Status",
          field: "is_deleted",
          headerFilter: TableKit.customDropdownFilter(["Active", "In Trash"]),
          headerFilterFunc: TableKit.statusMatchFilter,
          width: 95,
          hozAlign: "center",
          formatter: function (cell) {
            return cell.getValue() ? '<span class="badge" style="color:var(--danger); border-color:var(--danger);">In Trash</span>' : '<span class="badge badge-signal">Active</span>';
          }
        },
        {
          title: "Actions",
          headerSort: false,
          hozAlign: "right",
          width: 220,
          formatter: function (cell) {
            var row = cell.getRow().getData();
            var out = '<div style="display: flex; gap: 4px; justify-content: flex-end; align-items: center;">';
            out += '<a class="btn btn-sm btn-mono" href="' + row.detail_url + '" style="padding: 2px 6px; font-size: 0.75rem;">View →</a>';
            if (row.is_deleted) {
              out += '<form method="post" action="' + row.restore_url + '" style="display:inline; margin:0;"><input type="hidden" name="csrf_token" value="' + CSRF_TOKEN + '"><button class="btn btn-sm" type="submit" style="padding: 2px 6px; font-size: 0.75rem;">Restore</button></form>';
              out += '<form method="post" action="' + row.purge_url + '" onsubmit="return confirm(\'PERMANENTLY delete inquiry from ' + row.name + '?\')" style="display:inline; margin:0;"><input type="hidden" name="csrf_token" value="' + CSRF_TOKEN + '"><button class="btn btn-sm btn-danger" type="submit" style="padding: 2px 6px; font-size: 0.75rem; background:var(--danger); color:#fff;">Delete</button></form>';
            } else {
              out += '<form method="post" action="' + row.delete_url + '" onsubmit="return confirm(\'Move inquiry from ' + row.name + ' to trash?\')" style="display:inline; margin:0;"><input type="hidden" name="csrf_token" value="' + CSRF_TOKEN + '"><button class="btn btn-sm btn-danger" type="submit" style="padding: 2px 6px; font-size: 0.75rem;">Trash</button></form>';
              out += '<form method="post" action="' + row.purge_url + '" onsubmit="return confirm(\'PERMANENTLY delete inquiry from ' + row.name + '?\')" style="display:inline; margin:0;"><input type="hidden" name="csrf_token" value="' + CSRF_TOKEN + '"><button class="btn btn-sm btn-danger" type="submit" style="padding: 2px 6px; font-size: 0.75rem; background:var(--danger); color:#fff;">Delete</button></form>';
            }
            out += '</div>';
            return out;
          }
        }
      ]
    });

    var bulkToolbar = document.getElementById('bulk-toolbar');
    var bulkCount = document.getElementById('bulk-selected-count');
    var bulkHiddenIds = document.getElementById('bulk-hidden-ids');
    var bulkActionInput = document.getElementById('bulk-action-input');
    var bulkForm = document.getElementById('bulk-form');

    function updateBulkState() {
      var selectedRows = table.getSelectedRows();
      if (selectedRows.length > 0) {
        bulkToolbar.style.display = 'flex';
        bulkCount.textContent = selectedRows.length + ' selected';
        bulkHiddenIds.innerHTML = '';
        selectedRows.forEach(function (row) {
          var input = document.createElement('input');
          input.type = 'hidden';
          input.name = 'ids';
          input.value = row.getData().id;
          bulkHiddenIds.appendChild(input);
        });
      } else {
        bulkToolbar.style.display = 'none';
      }
    }

    table.on("rowSelectionChanged", function () {
      updateBulkState();
    });

    window.deselectAllRows = function () {
      table.deselectRow();
      updateBulkState();
    };

    window.submitBulk = function (action, confirmMsg) {
      if (confirmMsg && !confirm(confirmMsg)) return;
      bulkActionInput.value = action;
      bulkForm.submit();
    };
  });
</script>
{% endblock %}
