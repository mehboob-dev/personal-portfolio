<!doctype html>
<html lang="en" data-theme="only-light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login — Dynamic QR & Lead Manager</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg-canvas);">
  <main style="width: 100%; max-width: 380px; padding: 20px;">
    <div class="card" style="padding: 28px; box-shadow: var(--shadow-md);">
      <div style="display: flex; align-items: center; margin-bottom: 20px;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <span class="brand-mark">MM</span>
          <span style="font-weight: 700; font-size: 1.05rem;">Admin Login</span>
        </div>
      </div>

      {% if error %}
      <div style="background: rgba(220, 38, 38, 0.08); border: 1px solid var(--danger); color: var(--danger); padding: 10px 14px; border-radius: var(--radius-sm); font-size: 0.85rem; margin-bottom: 18px; display: flex; align-items: center; gap: 8px;">
        <span style="font-weight: 700;">⚠</span>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <form method="post" action="{{ url_for('admin.login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
          <label for="login-username">Username</label>
          <input id="login-username" class="form-control mono" type="text" name="username" value="{{ username }}" autocomplete="username" required autofocus>
        </div>

        <div class="form-group">
          <label for="login-password">Password</label>
          <div style="position: relative; display: flex; align-items: center;">
            <input id="login-password" class="form-control mono" type="password" name="password" autocomplete="current-password" required style="padding-right: 44px; width: 100%;">
            <button id="toggle-password-btn" type="button" aria-label="Toggle password visibility" title="Toggle password visibility" style="position: absolute; right: 8px; background: none; border: none; padding: 6px; cursor: pointer; color: var(--text-muted); display: flex; align-items: center; justify-content: center; border-radius: 4px;">
              <!-- Eye Icon (Password Hidden) -->
              <svg id="eye-icon-show" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <!-- Eye-Off Icon (Password Visible) -->
              <svg id="eye-icon-hide" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>

        <button class="btn btn-primary" type="submit" style="width: 100%; margin-top: 8px;">Sign In to Console</button>
      </form>

      <div style="margin-top: 20px; text-align: center; border-top: 1px solid var(--border-subtle); padding-top: 14px;">
        <a href="{{ url_for('public.home') }}" style="font-size: 0.85rem; color: var(--text-muted);">← Return to Public Portfolio</a>
      </div>
    </div>
  </main>

  <script>
    (function () {
      var pwdInput = document.getElementById('login-password');
      var toggleBtn = document.getElementById('toggle-password-btn');
      var iconShow = document.getElementById('eye-icon-show');
      var iconHide = document.getElementById('eye-icon-hide');

      if (toggleBtn && pwdInput) {
        toggleBtn.addEventListener('click', function () {
          if (pwdInput.type === 'password') {
            pwdInput.type = 'text';
            iconShow.style.display = 'none';
            iconHide.style.display = 'block';
            toggleBtn.setAttribute('aria-label', 'Hide password');
          } else {
            pwdInput.type = 'password';
            iconShow.style.display = 'block';
            iconHide.style.display = 'none';
            toggleBtn.setAttribute('aria-label', 'Show password');
          }
        });
      }
    })();
  </script>
</body>
</html>
