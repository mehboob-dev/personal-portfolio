[project]
name = "mehboob-portfolio"
version = "0.1.0"
description = "Personal portfolio + trading-engine showcase + dynamic QR manager for Mehboob Meghani"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "flask-sqlalchemy>=3.1",
    "flask-migrate>=4.0",
    "flask-login>=0.6",
    "flask-wtf>=1.2",
    "jinja2>=3.1",
    "user-agents>=2.2",
    "qrcode>=7.4",
    "pillow>=10.0",
    "python-dotenv>=1.0",
    "pymysql>=1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
